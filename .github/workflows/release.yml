name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      # A tag that disagrees with the manifest ships a version HACS will
      # report incorrectly, and it is invisible until someone installs it.
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/panda_jetpack/manifest.json)
          if [ "$tag" != "$manifest" ]; then
            echo "tag is $tag but manifest.json says $manifest"
            exit 1
          fi

      - name: Build the component zip
        run: |
          cd custom_components/panda_jetpack
          zip -r ../../panda_jetpack.zip .

      # Third-party action running with contents: write -- pinned to a full
      # commit SHA so a moved tag cannot cut a release with our permissions.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.1.0
        with:
          files: panda_jetpack.zip
          generate_release_notes: true
